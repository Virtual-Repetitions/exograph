# Workflow to build and publish the Windows binaries on every merge to main.
#
# Performs:
# - Build exo, exo-server, exo-lsp and exo-mcp-bridge for x86_64-pc-windows-msvc in release mode
# - Package them (plus LICENSE) into exograph-x86_64-pc-windows-msvc.zip with a SHA256 checksum
# - Upload them as a workflow artifact
# - Publish them to the `v<version>` GitHub release (version read from Cargo.toml), creating it if needed
#
# This mirrors the tagging scheme used by build-docker-image.yml so the image and the
# Windows binaries for a given version line up.

name: Build Windows Binary

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 24
  TARGET: x86_64-pc-windows-msvc

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6

      - name: Read Exograph version
        id: version
        shell: bash
        run: |
          VERSION=$(awk -F\" '/^version =/ {print $2; exit}' Cargo.toml)
          if [ -z "$VERSION" ]; then
            echo "Unable to determine version from Cargo.toml" >&2
            exit 1
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VERSION}"

      - name: Install deps
        run: choco install protoc

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install NASM for aws-lc-rs on Windows
        uses: ilammy/setup-nasm@v1

      - name: Add Rust target
        run: rustup target add ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Remove stale rusty_v8 checksums
        shell: bash
        run: ./scripts/fix-rusty-v8-cache.sh target

      - name: Build
        run: cargo build -p cli -p server-actix -p lsp -p mcp-bridge --target ${{ env.TARGET }} --release

      - name: Smoke test the binaries
        shell: bash
        run: target/${{ env.TARGET }}/release/exo.exe --version

      - name: Create zip of binaries
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ env.TARGET }}/release/exo.exe dist/
          cp target/${{ env.TARGET }}/release/exo-server.exe dist/
          cp target/${{ env.TARGET }}/release/exo-lsp.exe dist/
          cp target/${{ env.TARGET }}/release/exo-mcp-bridge.exe dist/
          cp LICENSE dist/
          cd dist/
          7z a exograph-${{ env.TARGET }}.zip *

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          cd dist/
          $hash = (Get-FileHash -Algorithm SHA256 exograph-${{ env.TARGET }}.zip).Hash.ToLower()
          $hash | Out-File -FilePath exograph-${{ env.TARGET }}.zip.sha256 -Encoding ascii -NoNewline
          Get-Content exograph-${{ env.TARGET }}.zip.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: exograph-${{ env.TARGET }}
          path: |
            dist/exograph-${{ env.TARGET }}.zip
            dist/exograph-${{ env.TARGET }}.zip.sha256

      - name: Publish to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Windows binaries for Exograph ${{ steps.version.outputs.value }} (built from ${GITHUB_SHA})" \
              --target "$GITHUB_SHA"
          else
            echo "Release $TAG already exists, uploading assets to it"
          fi
          gh release upload "$TAG" \
            "dist/exograph-${{ env.TARGET }}.zip" \
            "dist/exograph-${{ env.TARGET }}.zip.sha256" \
            --clobber

      - name: Summary
        shell: bash
        run: |
          {
            echo "### 🪟 Windows binaries published"
            echo ""
            echo "**Release:** v${{ steps.version.outputs.value }}"
            echo "**Target:** ${{ env.TARGET }}"
            echo "**Commit:** ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
