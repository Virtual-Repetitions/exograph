# Workflow to build and publish the Windows binaries when a merge to main carries
# a version that has not been published yet.
#
# Like build-unix-binaries.yml: a merge that keeps the version in Cargo.toml
# builds nothing (bump it to publish, or run this workflow by hand to rebuild),
# and a newer merge carrying the same unpublished version cancels the older build.
#
# Performs:
# - Build exo, exo-server, exo-lsp and exo-mcp-bridge for x86_64-pc-windows-msvc in release mode
# - Package them (plus LICENSE) into exograph-x86_64-pc-windows-msvc.zip with a SHA256 checksum
# - Upload them as a workflow artifact
# - Publish them to the `v<version>` GitHub release (version read from Cargo.toml), creating it if needed
#
# This mirrors the tagging scheme used by build-docker-image.yml so the image and the
# Windows binaries for a given version line up.

name: Build Windows Binary

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 24
  TARGET: x86_64-pc-windows-msvc

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false

      - name: Skip versions that are already published
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(awk -F\" '/^version =/ {print $2; exit}' Cargo.toml)
          if [ -z "$VERSION" ]; then
            echo "Unable to determine version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run: rebuilding v${VERSION}"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PUBLISHED=$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' || true)
          MISSING=""
          for asset in "exograph-${TARGET}.zip" "exograph-${TARGET}.zip.sha256"; do
            grep -qxF "$asset" <<< "$PUBLISHED" || MISSING="${MISSING} ${asset}"
          done

          if [ -n "$MISSING" ]; then
            echo "v${VERSION} still needs:${MISSING}"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "v${VERSION} is already published; bump the version in Cargo.toml to build a new one."
            echo "build=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⏭️ Skipped: v${VERSION} is already published"
              echo ""
              echo "Bump the version in Cargo.toml to publish a new build, or run this workflow by hand to rebuild v${VERSION}."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build-windows:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    concurrency:
      group: ${{ github.workflow }}-v${{ needs.plan.outputs.version }}
      cancel-in-progress: true
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6

      - name: Install deps
        run: choco install protoc

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install NASM for aws-lc-rs on Windows
        uses: ilammy/setup-nasm@v1

      - name: Add Rust target
        run: rustup target add ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Remove stale rusty_v8 checksums
        shell: bash
        run: ./scripts/fix-rusty-v8-cache.sh target

      - name: Build
        run: cargo build -p cli -p server-actix -p lsp -p mcp-bridge --target ${{ env.TARGET }} --release

      - name: Smoke test the binaries
        shell: bash
        run: target/${{ env.TARGET }}/release/exo.exe --version

      - name: Create zip of binaries
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ env.TARGET }}/release/exo.exe dist/
          cp target/${{ env.TARGET }}/release/exo-server.exe dist/
          cp target/${{ env.TARGET }}/release/exo-lsp.exe dist/
          cp target/${{ env.TARGET }}/release/exo-mcp-bridge.exe dist/
          cp LICENSE dist/
          cd dist/
          7z a exograph-${{ env.TARGET }}.zip *

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          cd dist/
          $hash = (Get-FileHash -Algorithm SHA256 exograph-${{ env.TARGET }}.zip).Hash.ToLower()
          $hash | Out-File -FilePath exograph-${{ env.TARGET }}.zip.sha256 -Encoding ascii -NoNewline
          Get-Content exograph-${{ env.TARGET }}.zip.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: exograph-${{ env.TARGET }}
          path: |
            dist/exograph-${{ env.TARGET }}.zip
            dist/exograph-${{ env.TARGET }}.zip.sha256

      - name: Publish to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Windows binaries for Exograph ${{ needs.plan.outputs.version }} (built from ${GITHUB_SHA})" \
              --target "$GITHUB_SHA"
          else
            echo "Release $TAG already exists, uploading assets to it"
          fi
          gh release upload "$TAG" \
            "dist/exograph-${{ env.TARGET }}.zip" \
            "dist/exograph-${{ env.TARGET }}.zip.sha256" \
            --clobber

      - name: Summary
        shell: bash
        run: |
          {
            echo "### 🪟 Windows binaries published"
            echo ""
            echo "**Release:** v${{ needs.plan.outputs.version }}"
            echo "**Target:** ${{ env.TARGET }}"
            echo "**Commit:** ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
